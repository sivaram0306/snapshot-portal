<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Settings - AWS Snapshot Portal</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">

      <div class="logo-mark">A</div>

      <div>
        <div class="logo-title">
          AWS Snapshot
        </div>

        <div class="logo-subtitle">
          Management Portal
        </div>
      </div>

    </div>


    <nav class="menu">

      <a href="/index.html" class="menu-item">
        <span class="menu-icon">⌂</span>
        <span class="menu-text">Dashboard</span>
      </a>

      <a href="/pages/instances.html" class="menu-item">
        <span class="menu-icon">▣</span>
        <span class="menu-text">Instances</span>
      </a>

      <a href="/pages/volumes.html" class="menu-item">
        <span class="menu-icon">▤</span>
        <span class="menu-text">Volumes</span>
      </a>

      <a href="/pages/snapshots.html" class="menu-item">
        <span class="menu-icon">◉</span>
        <span class="menu-text">Snapshots</span>
      </a>

      <div class="menu-label">
        MANAGEMENT
      </div>

      <a href="/pages/accounts.html" class="menu-item">
        <span class="menu-icon">☁</span>
        <span class="menu-text">Accounts</span>
      </a>

      <a href="/pages/access.html" class="menu-item">
        <span class="menu-icon">🔑</span>
        <span class="menu-text">AWS Access</span>
      </a>

      <a
        href="/pages/settings.html"
        class="menu-item active"
      >
        <span class="menu-icon">⚙</span>
        <span class="menu-text">Settings</span>
      </a>

    </nav>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-title">

        <h1>Settings</h1>

        <p>
          Portal configuration
        </p>

      </div>

    </header>


    <div class="content">

      <div class="page-header">

        <div>

          <h2>
            Settings
          </h2>

          <p>
            Configure local portal preferences.
          </p>

        </div>

      </div>


      <div class="account">

        <h3>
          Default Region
        </h3>

        <p>
          Select the default AWS region.
        </p>

        <select id="settingsRegion">

          <option value="ap-south-1">
            Mumbai
          </option>

          <option value="ap-southeast-1">
            Singapore
          </option>

          <option value="us-east-1">
            US East
          </option>

        </select>

      </div>

    </div>

  </main>

</div>


<div id="toast" class="toast"></div>


<script src="/js/common.js"></script>

<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const select =
      document.getElementById(
        "settingsRegion"
      );

    select.value =
      getRegion();


    select.addEventListener(
      "change",
      () => {

        setRegion(
          select.value
        );

        toast(
          "Default region saved."
        );

      }
    );

  }
);

</script>

</body>

</html>
